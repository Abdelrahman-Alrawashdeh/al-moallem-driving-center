<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة نماذج الثقيلة | مركز المعلّم</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#142843;background:#f2f5fa;color-scheme:light}*{box-sizing:border-box}body{margin:0}header{background:#112b4c;color:#fff;padding:24px max(20px,calc((100vw - 1200px)/2))}h1{font-size:25px;margin:0 0 10px}p{line-height:1.85}header p{color:#d0dcec;margin:0}main{max-width:1200px;margin:24px auto;padding:0 20px}button,select,input,textarea{font:inherit}button,select,input{min-height:46px;border:1px solid #c4cede;border-radius:9px;padding:10px;background:white;color:#142843}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #246bff;outline-offset:2px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}.primary{background:#ffcb35;border-color:#ffcb35;font-weight:bold}#status{margin-inline-start:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:7px;margin:16px 0}.grid button{font-size:12px}.grid .documented{background:#e2f5e9;border-color:#81b699}.grid .confirmed{background:#dceaff;border-color:#719ee7}.grid [aria-current=true]{outline:3px solid #173b6b;outline-offset:1px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.panel{border:1px solid #d9e1ec;border-radius:16px;background:#fff;padding:22px;min-width:0}.original{width:100%;height:auto;max-height:1000px;object-fit:contain}.tag{color:#48617e;font-size:13px}h2{font-size:21px;line-height:1.8}.choice{display:flex;align-items:center;gap:12px;border:1px solid #d0dae8;border-radius:10px;padding:12px;margin:10px 0;line-height:1.7;cursor:pointer}.choice:has(input:checked){background:#eaf1ff;border-color:#3977d8}.choice input{min-height:20px;width:20px;flex-shrink:0}.note{background:#f4f7fb;padding:14px;border-radius:9px;font-size:14px;line-height:1.9}.note a{overflow-wrap:anywhere;color:#165ab4}textarea{width:100%;min-height:90px;border:1px solid #c4cede;border-radius:9px;padding:12px;margin:8px 0}label.title{display:block;margin-top:18px}.navigation{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.empty{padding:30px;background:#fff;border-radius:12px}.notice{font-size:13px;color:#526781}#message{min-height:24px;color:#174773;line-height:1.7}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{padding:16px}.toolbar>*{flex:1}#status{flex-basis:100%}h1{font-size:21px}main{padding:0 14px}.original{max-height:none}}
</style></head><body><header><h1>مركز المعلّم · مراجعة أسئلة الثقيلة</h1><p>نسخة عمل للمدرب: الصورة الأصلية، النص والخيارات، ومرجع التصحيح عند توفره.</p></header><main><div class="toolbar"><select id="form" aria-label="النموذج"><option value="3">النموذج الأول</option><option value="4">النموذج الثاني</option></select><select id="filter" aria-label="حالة المراجعة"><option value="all">جميع الأسئلة</option><option value="pending">مفتاح الأصل غير معتمد</option><option value="reviewed">موثقة بمرجع</option></select><button id="export" class="primary">تنزيل إجابات المدرب</button><span id="status" role="status"></span></div><label class="title" for="reviewer">اسم المدرب المراجع</label><input id="reviewer" autocomplete="name" placeholder="اسم المدرب"><p class="notice">الأخضر: موثّق بمرجع مستقل، والأزرق: راجعه المدرب هنا. لا تُنشر التعديلات تلقائيًا؛ ملف التنزيل للمراجعة والدمج فقط. الحفظ محلي في هذا المتصفح، ويُنصح بتنزيل الإجابات بعد كل جلسة.</p><nav id="grid" class="grid" aria-label="الانتقال إلى سؤال"></nav><div id="content"></div><p id="message" role="status" aria-live="polite"></p></main><script>
const data=/*REVIEW_DATA*/[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storageKey='moallem-heavy-review-2026-09-25';let state={reviewer:'',answers:{}},current=0,visible=[];
try{const saved=JSON.parse(localStorage.getItem(storageKey));if(saved&&saved.answers&&typeof saved.answers==='object')state=saved;}catch{}
$('reviewer').value=state.reviewer||'';
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));}catch{$('message').textContent='المتصفح لم يسمح بالحفظ المحلي؛ نزّل الإجابات قبل إغلاق الصفحة.';}}
function record(q){const a=state.answers[q.id];return a?.fingerprint===q.fingerprint?a:null;}
function refresh(){const form=$('form').value,filter=$('filter').value;visible=data.filter(q=>q.id.startsWith('form-'+form+'-')&&(filter==='all'||(filter==='reviewed'?q.status==='reference-reviewed':q.status!=='reference-reviewed'&&!record(q)?.confirmed)));current=Math.min(current,Math.max(0,visible.length-1));render();}
function render(){const q=visible[current];$('status').textContent=`${data.filter(q=>record(q)?.confirmed).length} راجعها المدرب / 120 سؤالًا`;$('grid').innerHTML=visible.map((q,i)=>`<button data-index="${i}" class="${record(q)?.confirmed?'confirmed':q.status==='reference-reviewed'?'documented':''}" aria-current="${i===current}" aria-label="السؤال ${Number(q.id.split('q')[1])}">${Number(q.id.split('q')[1])}</button>`).join('');if(!q){$('content').innerHTML='<p class="empty">لا توجد أسئلة ضمن هذا الفلتر.</p>';return;}const draft=record(q),selected=draft?.answer??q.answer;$('content').innerHTML=`<div class="layout"><section class="panel"><span class="tag">السؤال ${Number(q.id.split('q')[1])} · ${esc(q.id)}</span><h2>${esc(q.text)}</h2><div role="radiogroup" aria-label="الإجابة الصحيحة">${q.options.map((o,i)=>`<label class="choice"><input type="radio" name="answer" value="${i}" ${selected===i?'checked':''}><span>${i+1}. ${esc(o)}</span></label>`).join('')}</div><div class="note"><strong>${q.status==='reference-reviewed'?'تم التحقق بمرجع مستقل':q.status==='revised'?'نُشرت صياغة مصححة مستقلة':q.status==='merged'?'دُمج الموضوع بسؤال قائم':'لم يُعتمد للتصحيح بعد'}</strong><br>${esc(q.reviewNote)}${q.duplicateOf?'<br>مكرر من: '+esc(q.duplicateOf):''}${q.evidence?`<br><a href="${esc(q.evidence.url)}" target="_blank" rel="noopener noreferrer">${esc(q.evidence.title)}</a> · ${esc(q.evidence.section)}`:''}</div><label class="title" for="note">مرجع الإجابة أو ملاحظة المدرب</label><textarea id="note" placeholder="اذكر صفحة الكتاب أو وضّح التصحيح">${esc(draft?.note||'')}</textarea><button id="confirm" class="primary">${draft?.confirmed?'تحديث اعتماد المدرب':'راجعت الصورة والخيارات وأعتمد الإجابة'}</button><div class="navigation"><button id="previous" ${current===0?'disabled':''}>السابق</button><button id="next" ${current===visible.length-1?'disabled':''}>التالي</button></div></section><section class="panel"><h2>الصورة الأصلية</h2><img class="original" src="${esc(q.image)}" alt="السؤال الأصلي وخياراته من النموذج"></section></div>`;
 $('previous').onclick=()=>{current--;render();};$('next').onclick=()=>{current++;render();};
 document.querySelectorAll('[name=answer]').forEach(input=>input.onchange=()=>{state.answers[q.id]={fingerprint:q.fingerprint,answer:Number(input.value),note:$('note').value,confirmed:false};save();});
 $('note').oninput=()=>{const checked=document.querySelector('[name=answer]:checked');state.answers[q.id]={fingerprint:q.fingerprint,answer:checked?Number(checked.value):null,note:$('note').value,confirmed:false};save();};
 $('confirm').onclick=()=>{const checked=document.querySelector('[name=answer]:checked');if(!checked){$('message').textContent='اختر الإجابة الصحيحة أولًا.';return;}if(!$('reviewer').value.trim()){$('message').textContent='اكتب اسم المدرب قبل اعتماد الإجابة.';$('reviewer').focus();return;}if(!$('note').value.trim()&&q.status!=='reference-reviewed'){$('message').textContent='أضف مرجعًا أو شرحًا للإجابة حتى يمكن مراجعتها قبل النشر.';$('note').focus();return;}state.answers[q.id]={fingerprint:q.fingerprint,answer:Number(checked.value),note:$('note').value.trim(),confirmed:true,reviewedAt:new Date().toISOString()};save();$('message').textContent='حُفظ اعتماد السؤال محليًا. نزّل الملف للاحتفاظ بنسخة.';render();};
}
$('grid').onclick=e=>{const b=e.target.closest('[data-index]');if(b){current=Number(b.dataset.index);render();}};$('form').onchange=$('filter').onchange=()=>{current=0;refresh();};$('reviewer').oninput=()=>{state.reviewer=$('reviewer').value.trim();save();};
$('export').onclick=()=>{const answers=data.filter(q=>record(q)?.confirmed).map(q=>({id:q.id.replace(/q0(\d)$/,'q$1'),correctOptionNumber:record(q).answer+1,optionCount:q.options.length,sourceFingerprint:q.fingerprint,note:record(q).note,reviewedAt:record(q).reviewedAt}));if(!answers.length){$('message').textContent='لم تعتمد إجابات بعد. راجع سؤالًا ثم اعتمده لتنزيله.';return;}const payload={schema:'moallem-heavy-trainer-key-v1',reviewer:$('reviewer').value.trim(),exportedAt:new Date().toISOString(),answers};if(!payload.reviewer){$('message').textContent='أدخل اسم المدرب قبل تنزيل الملف.';return;}const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='heavy-trainer-answers.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('message').textContent=`تم تجهيز ${answers.length} إجابة للتحميل. الملف لا يغير الموقع تلقائيًا.`;};refresh();
</script></body></html>
